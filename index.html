<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Pokédex"/>
  <title>Pokédex</title>
  <style>
    :root{
      --bg:rgba(248,245,255,0.55);
      --text:#1c1c1e;--subtext:#6e6e73;
      --border:rgba(0,0,0,0.1);
      --shadow:0 2px 12px rgba(0,0,0,0.07);
      --radius:14px;
      --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
      --glass:rgba(255,255,255,0.62);
      --glass-border:rgba(255,255,255,0.6);
      --glass-hi:inset 0 1px 0 rgba(255,255,255,0.85);
      --glass-shadow:0 4px 20px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.85);
      --blur:blur(22px) saturate(180%);
      --page-bg:
        radial-gradient(ellipse at 12% 18%,rgba(195,148,255,0.52) 0%,transparent 44%),
        radial-gradient(ellipse at 88% 8%,rgba(120,190,255,0.48) 0%,transparent 40%),
        radial-gradient(ellipse at 68% 90%,rgba(255,165,195,0.46) 0%,transparent 44%),
        radial-gradient(ellipse at 4% 78%,rgba(120,225,255,0.38) 0%,transparent 42%),
        radial-gradient(ellipse at 52% 50%,rgba(255,215,155,0.18) 0%,transparent 52%),
        #eeeaff;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--page-bg);background-attachment:fixed;color:var(--text);min-height:100vh;overflow-x:hidden}

    /* NAVBAR */
    .navbar{background:rgba(255,255,255,.72);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid rgba(255,255,255,0.45);box-shadow:0 1px 0 rgba(0,0,0,0.06),var(--glass-hi);padding:calc(var(--safe-top) + 10px) 16px 0;position:sticky;top:0;z-index:100}
    .navbar-top{display:flex;align-items:center;gap:10px;padding-bottom:10px}
    .nav-logo{width:26px;height:26px;flex-shrink:0}
    .nav-title{font-size:20px;font-weight:800;flex:1}
    .tab-bar{display:flex;border-top:1px solid var(--border)}
    .tab-btn{flex:1;padding:10px 4px;border:none;background:transparent;font-size:12px;font-weight:600;color:var(--subtext);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
    .tab-btn.active{color:#F08030;border-bottom-color:#F08030}

    /* FILTERS */
    .search-wrap{padding:12px 16px 6px}
    .search-box{display:flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:12px;padding:9px 13px;border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
    .search-box input{flex:1;border:none;outline:none;font-size:16px;background:transparent;color:var(--text)}
    .search-box input::placeholder{color:var(--subtext)}
    /* FILTER BAR */
    .filter-bar{display:flex;gap:8px;padding:8px 16px 4px}
    .filter-btn{flex:1;padding:8px 6px;border-radius:12px;border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--glass-shadow);font-size:12px;font-weight:700;cursor:pointer;color:var(--subtext);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .2s;-webkit-tap-highlight-color:transparent}
    .filter-btn.active{background:#1c1c1e;color:white;border-color:#1c1c1e}
    .filter-btn.type-active{color:white;border-color:transparent}
    /* FILTER PICKER SHEET */
    .fpick-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:600;display:none;align-items:flex-end}
    .fpick-overlay.open{display:flex}
    .fpick-sheet{background:rgba(255,255,255,0.82);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-bottom:none;border-radius:20px 20px 0 0;width:100%;padding:0 16px calc(var(--safe-bottom)+16px);max-height:75vh;overflow-y:auto}
    .fpick-title{font-size:16px;font-weight:700;padding:14px 0 10px;text-align:center;border-bottom:1px solid var(--border);margin-bottom:10px}
    .fpick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:4px}
    .fpick-opt{padding:10px 6px;border-radius:12px;border:1px solid rgba(255,255,255,0.5);background:rgba(255,255,255,0.45);font-size:12px;font-weight:700;cursor:pointer;text-align:center;color:var(--text);-webkit-tap-highlight-color:transparent}
    .fpick-opt.sel{background:#1c1c1e;color:white;border-color:#1c1c1e}
    .fpick-opt.type-opt{color:white;border-color:transparent}
    .fpick-opt.type-opt.sel{outline:3px solid #1c1c1e;outline-offset:2px}
    .fpick-list{display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
    .fpick-list-item{padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.5);background:rgba(255,255,255,0.45);font-size:14px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .fpick-list-item.sel{background:#1c1c1e;color:white;border-color:#1c1c1e}
    .fpick-cancel{width:100%;padding:13px;border-radius:12px;border:none;background:#f5f5f5;font-size:15px;font-weight:600;color:#555;cursor:pointer;margin-top:8px}

    /* LIST */
    #pokedex-view{padding-bottom:calc(var(--safe-bottom) + 70px)}
    .poke-list{display:flex;flex-direction:column;gap:7px;padding:8px 16px}
    .poke-row{display:flex;align-items:center;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--glass-shadow);cursor:pointer;transition:transform .12s}
    .poke-row:active{transform:scale(.98)}
    .poke-row.in-team{outline:2px solid #F8D030}
    .poke-row-img{width:62px;height:62px;object-fit:contain;flex-shrink:0;padding:4px}
    .poke-row-body{flex:1;padding:10px 8px 10px 10px;min-width:0}
    .poke-row-num{font-size:11px;color:var(--subtext);font-weight:500}
    .poke-row-name{font-size:15px;font-weight:700;text-transform:capitalize;margin-bottom:5px}
    .poke-row-types{display:flex;gap:4px;flex-wrap:wrap}
    .type-pill{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;color:white;text-shadow:0 1px 2px rgba(0,0,0,.25)}
    .poke-row-right{padding:0 12px 0 4px;display:flex;align-items:center}
    .fav-star{font-size:16px;opacity:.2;transition:opacity .2s}
    .fav-star.on{opacity:1}

    /* LOADER */
    .loader-wrap{display:flex;justify-content:center;padding:50px 0}
    .loader{width:36px;height:36px;border-radius:50%;border:4px solid var(--border);border-top-color:#F08030;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-msg{text-align:center;padding:40px 20px;color:var(--subtext);font-size:14px}

    /* PANEL */
    .panel{position:fixed;inset:0;background:var(--page-bg);background-attachment:fixed;z-index:200;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding-bottom:calc(var(--safe-bottom)+20px)}
    .panel.open{transform:translateX(0)}
    .panel-back{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.3);border:none;border-radius:10px;padding:7px 13px;color:white;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:14px}
    .detail-header{padding:calc(var(--safe-top)+14px) 18px 16px;background:linear-gradient(150deg,var(--hcol,#888) 0%,color-mix(in srgb,var(--hcol,#888) 70%,black) 100%);position:relative;color:white;min-height:180px}
    .detail-hero-img{position:absolute;right:12px;bottom:8px;width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(0,0,0,.25))}
    .dh-num{font-size:12px;opacity:.75;margin-bottom:3px}
    .dh-name{font-size:30px;font-weight:800;text-transform:capitalize;margin-bottom:8px}
    .dh-types{display:flex;gap:7px;margin-bottom:10px}
    .dh-type{padding:4px 14px;border-radius:16px;background:rgba(255,255,255,.28);font-size:13px;font-weight:600;text-transform:capitalize}


    /* DETAIL TABS */
    .detail-tabs{display:flex;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--glass-border);margin-top:6px}
    .detail-tab{flex:1;padding:11px 4px;border:none;background:transparent;font-size:12px;font-weight:600;color:var(--subtext);border-bottom:2px solid transparent;cursor:pointer;transition:all .2s}
    .detail-tab.active{color:#F08030;border-bottom-color:#F08030}
    .detail-pane{display:none;padding:16px}
    .detail-pane.active{display:block}
    .section-label{font-size:13px;font-weight:700;color:var(--subtext);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;margin-top:18px}
    .section-label:first-child{margin-top:0}

    /* INFO */
    .info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}
    .info-cell{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);border-radius:12px;padding:12px 14px}
    .info-cell-lbl{font-size:11px;color:var(--subtext);margin-bottom:3px}
    .info-cell-val{font-size:14px;font-weight:600;text-transform:capitalize}

    /* STATS */
    .stat-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
    .stat-lbl{width:95px;font-size:12px;color:var(--subtext);font-weight:500;flex-shrink:0}
    .stat-bar{flex:1;height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden}
    .stat-fill{height:100%;border-radius:3px;transition:width .9s cubic-bezier(.4,0,.2,1)}
    .stat-val{width:32px;text-align:right;font-size:12px;font-weight:700}

    /* WEAKNESSES */
    .weak-grid{display:flex;flex-wrap:wrap;gap:6px}
    .weak-chip{padding:4px 10px;border-radius:10px;font-size:11px;font-weight:700;color:white;text-shadow:0 1px 2px rgba(0,0,0,.2)}
    .weak-chip .mult{font-size:9px;opacity:.9;margin-left:3px;font-weight:800}

    /* MOVE TABLE */
    .move-table{width:100%;border-collapse:collapse;font-size:12px}
    .move-table th{text-align:left;color:var(--subtext);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--border);font-size:11px}
    .move-table td{padding:7px 4px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
    .move-table tr:last-child td{border-bottom:none}
    .move-name{font-weight:600;text-transform:capitalize}
    .move-game-select{width:100%;padding:9px 13px;border-radius:10px;border:1px solid var(--glass-border);font-size:14px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--text);margin-bottom:12px;-webkit-appearance:none;appearance:none}

    /* EVO TREE */
    .evo-tree{padding:4px 0}
    .evo-level{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:4px 0}
    .evo-item{display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:70px}
    .evo-item img{width:68px;height:68px;object-fit:contain}
    .evo-item-name{font-size:11px;font-weight:600;text-transform:capitalize;margin-top:3px;text-align:center}
    .evo-arrow-row{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:2px 0}
    .evo-arrow-item{display:flex;flex-direction:column;align-items:center;min-width:70px;color:var(--subtext);font-size:18px}
    .evo-cond-label{font-size:10px;color:#F08030;font-weight:600;text-align:center;max-width:80px;line-height:1.3;text-transform:capitalize;margin-bottom:1px}
    .evo-no-evolve{text-align:center;color:var(--subtext);font-size:13px;padding:16px 0}

    /* TEAM BTN */
    .team-btn{width:100%;padding:13px;border:none;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px}
    .team-btn.add{background:#1c1c1e;color:white}
    .team-btn.remove{background:#F8D030;color:#1c1c1e}

    /* TEAM VIEW */
    #team-view{display:none;padding:16px 16px calc(var(--safe-bottom)+70px)}
    #team-view.show{display:block}

    /* Team selector */
    .team-selector{display:flex;gap:8px;padding:0 0 14px;overflow-x:auto;scrollbar-width:none;align-items:center}
    .team-selector::-webkit-scrollbar{display:none}
    .team-tab{white-space:nowrap;padding:7px 12px;border-radius:20px;border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--glass-shadow);font-size:13px;font-weight:600;cursor:pointer;color:var(--subtext);flex-shrink:0;display:flex;align-items:center;gap:6px;transition:all .2s}
    .team-tab.active{background:#1c1c1e;color:white;border-color:#1c1c1e}
    .team-tab-del{font-size:11px;opacity:.6;line-height:1;padding:1px 2px}
    .team-add-btn{width:32px;height:32px;border-radius:50%;border:1.5px dashed var(--border);background:transparent;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--subtext);flex-shrink:0}

    /* Team name + actions */
    .team-name-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .team-name-input{flex:1;font-size:20px;font-weight:800;border:none;background:transparent;color:var(--text);outline:none;border-bottom:2px solid var(--border);padding-bottom:4px}
    .team-name-input::placeholder{color:var(--subtext)}
    .team-actions{display:flex;gap:8px;margin-bottom:16px}
    .team-action-btn{flex:1;padding:10px;border-radius:12px;border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--glass-shadow);font-size:13px;font-weight:600;cursor:pointer;color:var(--text);text-align:center}

    /* Team grid */
    .team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
    .team-slot{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:14px;box-shadow:var(--glass-shadow);min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer}
    .team-slot.empty{border:2px dashed rgba(150,130,200,0.35);box-shadow:none;background:rgba(255,255,255,0.3);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:background .15s}
    .team-slot.empty:active{background:rgba(255,255,255,0.45)}
    .team-slot.empty .empty-lbl{color:var(--subtext);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
    .empty-plus{font-size:26px;line-height:1;color:var(--border)}
    /* ADD POKEMON PICKER */
    .add-poke-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:600;display:none;align-items:flex-end}
    .add-poke-overlay.open{display:flex}
    .add-poke-sheet{background:rgba(255,255,255,0.82);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-bottom:none;border-radius:20px 20px 0 0;width:100%;max-height:80vh;display:flex;flex-direction:column;padding-bottom:calc(var(--safe-bottom)+10px)}
    .add-poke-search{margin:12px 16px 8px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:16px;outline:none;width:calc(100% - 32px);box-sizing:border-box}
    .add-poke-search:focus{border-color:#F08030}
    .add-poke-list{overflow-y:auto;flex:1}
    .add-poke-item{display:flex;align-items:center;padding:10px 16px;gap:12px;cursor:pointer;border-bottom:1px solid #f5f5f5;-webkit-tap-highlight-color:transparent}
    .add-poke-item:active{background:#f9f9f9}
    .add-poke-item.in-team{opacity:.4;cursor:default}
    .add-poke-item img{width:48px;height:48px;object-fit:contain;flex-shrink:0}
    .add-poke-name{font-size:14px;font-weight:700;text-transform:capitalize}
    .add-poke-num{font-size:12px;color:var(--subtext)}
    .add-poke-types{display:flex;gap:4px;margin-top:3px}
    .add-poke-badge{margin-left:auto;font-size:11px;font-weight:700;color:var(--subtext);background:var(--bg);padding:3px 8px;border-radius:8px;flex-shrink:0}
    .team-slot img{width:70px;height:70px;object-fit:contain;margin-bottom:4px}
    .ts-name{font-size:13px;font-weight:700;text-transform:capitalize}
    .ts-nick{font-size:11px;color:var(--subtext)}
    .ts-remove{position:absolute;top:8px;right:8px;background:rgba(255,255,255,0.65);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.5);border-radius:50%;width:22px;height:22px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--subtext)}
    .ts-edit{position:absolute;top:8px;left:8px;background:rgba(255,255,255,0.65);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.5);border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .move-slots{display:flex;flex-direction:column;gap:5px;margin-top:8px;width:100%}
    .move-slot-btn{width:100%;padding:6px 10px;border-radius:8px;border:1.5px dashed rgba(150,130,200,0.35);background:rgba(255,255,255,0.3);font-size:11px;font-weight:600;color:var(--subtext);cursor:pointer;text-align:left;text-transform:capitalize}
    .move-slot-btn.filled{background:rgba(255,255,255,0.7);border-style:solid;border-color:var(--glass-border);color:var(--text)}
    .coverage-card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;box-shadow:var(--glass-shadow);margin-bottom:12px}
    .coverage-title{font-size:15px;font-weight:700;margin-bottom:12px}
    .coverage-types{display:flex;flex-wrap:wrap;gap:6px}

    /* TYPE CHART CALCULATOR */
    #types-view{display:none;padding:16px 16px calc(var(--safe-bottom)+70px)}
    #types-view.show{display:block}
    #tc-bubbles{display:flex;gap:12px;margin-bottom:20px}
    .tc-bubble{flex:1;padding:14px 10px;border-radius:16px;border:2px dashed rgba(150,130,200,0.4);background:rgba(255,255,255,0.4);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);font-size:15px;font-weight:700;color:var(--subtext);text-align:center;cursor:pointer;transition:all .2s;user-select:none;-webkit-tap-highlight-color:transparent}
    .tc-bubble.filled{border-style:solid;border-color:transparent;color:white;text-shadow:0 1px 3px rgba(0,0,0,.25)}
    .tc-picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:600;display:none;align-items:flex-end}
    .tc-picker-overlay.open{display:flex}
    .tc-picker-sheet{background:rgba(255,255,255,0.82);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-bottom:none;border-radius:20px 20px 0 0;width:100%;padding:0 16px calc(var(--safe-bottom)+16px);max-height:70vh;overflow-y:auto}
    .tc-picker-title{font-size:16px;font-weight:700;padding:14px 0 12px;text-align:center}
    .tc-picker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:12px}
    .tc-type-opt{padding:10px 6px;border-radius:12px;border:none;font-size:13px;font-weight:700;color:white;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.2);-webkit-tap-highlight-color:transparent}
    .tc-clear-btn{width:100%;padding:13px;border-radius:12px;border:none;background:#f5f5f5;font-size:15px;font-weight:600;color:#555;cursor:pointer;margin-bottom:4px}
    .tc-section-header{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--subtext);margin:16px 0 8px;padding-left:2px}
    .tc-result-section{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:14px;box-shadow:var(--glass-shadow);margin-bottom:10px}
    .tc-result-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
    .tc-result-types{display:flex;flex-wrap:wrap;gap:6px}
    .tc-result-normal{font-size:14px;color:var(--subtext);padding:6px 2px}

    /* MOVE PICKER MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end}
    .modal-overlay.open{display:flex}
    .modal-sheet{background:rgba(255,255,255,0.82);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-bottom:none;border-radius:20px 20px 0 0;width:100%;max-height:80vh;display:flex;flex-direction:column;padding-bottom:calc(var(--safe-bottom)+10px)}
    .modal-handle{width:36px;height:4px;background:#e0e0e0;border-radius:2px;margin:12px auto 8px;flex-shrink:0}

<script>
// ===== CONSTANTS =====
const TYPES=['normal','fire','water','electric','grass','ice','fighting','poison','ground','flying','psychic','bug','rock','ghost','dragon','dark','steel','fairy'];
const TC={normal:'#A8A878',fire:'#F08030',water:'#6890F0',electric:'#F8D030',grass:'#78C850',ice:'#98D8D8',fighting:'#C03028',poison:'#A040A0',ground:'#E0C068',flying:'#A890F0',psychic:'#F85888',bug:'#A8B820',rock:'#B8A038',ghost:'#705898',dragon:'#7038F8',dark:'#705848',steel:'#B8B8D0',fairy:'#EE99AC'};
const EFF={normal:{rock:.5,ghost:0,steel:.5},fire:{fire:.5,water:.5,grass:2,ice:2,bug:2,rock:.5,dragon:.5,steel:2},water:{fire:2,water:.5,grass:.5,ground:2,rock:2,dragon:.5},electric:{water:2,electric:.5,grass:.5,ground:0,flying:2,dragon:.5},grass:{fire:.5,water:2,grass:.5,poison:.5,ground:2,flying:.5,bug:.5,rock:2,dragon:.5,steel:.5},ice:{water:.5,grass:2,ice:.5,ground:2,flying:2,dragon:2,steel:.5},fighting:{normal:2,ice:2,poison:.5,flying:.5,psychic:.5,bug:.5,rock:2,ghost:0,dark:2,steel:2,fairy:.5},poison:{grass:2,poison:.5,ground:.5,rock:.5,ghost:.5,steel:0,fairy:2},ground:{fire:2,electric:2,grass:.5,poison:2,flying:0,bug:.5,rock:2,steel:2},flying:{electric:.5,grass:2,fighting:2,bug:2,rock:.5,steel:.5},psychic:{fighting:2,poison:2,psychic:.5,dark:0,steel:.5},bug:{fire:.5,grass:2,fighting:.5,flying:.5,psychic:2,ghost:.5,dark:2,steel:.5,fairy:.5},rock:{fire:2,ice:2,fighting:.5,ground:.5,flying:2,bug:2,steel:.5},ghost:{normal:0,psychic:2,ghost:2,dark:.5},dragon:{dragon:2,steel:.5,fairy:0},dark:{fighting:.5,psychic:2,ghost:2,dark:.5,fairy:.5},steel:{fire:.5,water:.5,electric:.5,ice:2,rock:2,steel:.5,fairy:2},fairy:{fire:.5,fighting:2,poison:.5,dragon:2,dark:2,steel:.5}};
const GR={1:[1,151],2:[152,251],3:[252,386],4:[387,493],5:[494,649],6:[650,721],7:[722,809],8:[810,905],9:[906,1025]};
const GV={'red-blue':['red','blue'],'yellow':['yellow'],'gold-silver':['gold','silver'],'crystal':['crystal'],'ruby-sapphire':['ruby','sapphire'],'emerald':['emerald'],'firered-leafgreen':['firered','leafgreen'],'diamond-pearl':['diamond','pearl'],'platinum':['platinum'],'heartgold-soulsilver':['heartgold','soulsilver'],'black-white':['black','white'],'black-2-white-2':['black-2','white-2'],'x-y':['x','y'],'omega-ruby-alpha-sapphire':['omega-ruby','alpha-sapphire'],'sun-moon':['sun','moon'],'ultra-sun-ultra-moon':['ultra-sun','ultra-moon'],'sword-shield':['sword','shield'],'scarlet-violet':['scarlet','violet']};
const SPRITE_GAMES=[{key:'modern',label:'Modern'},{key:'rb',label:'R/B',path:'generation-i/red-blue/transparent'},{key:'yellow',label:'Yellow',path:'generation-i/yellow/transparent'},{key:'gold',label:'Gold',path:'generation-ii/gold/transparent'},{key:'silver',label:'Silver',path:'generation-ii/silver/transparent'},{key:'crystal',label:'Crystal',path:'generation-ii/crystal/transparent'},{key:'rs',label:'R/S',path:'generation-iii/ruby-sapphire'},{key:'emerald',label:'Emerald',path:'generation-iii/emerald'},{key:'frlg',label:'FR/LG',path:'generation-iii/firered-leafgreen'},{key:'dp',label:'D/P',path:'generation-iv/diamond-pearl'},{key:'platinum',label:'Plat',path:'generation-iv/platinum'},{key:'hgss',label:'HG/SS',path:'generation-iv/heartgold-soulsilver'},{key:'bw',label:'B/W',path:'generation-v/black-white'},{key:'bw-anim',label:'BW Anim',path:'generation-v/black-white/animated'},{key:'xy',label:'X/Y',path:'generation-vi/x-y'},{key:'oras',label:'OR/AS',path:'generation-vi/omega-ruby-alpha-sapphire'},{key:'sm',label:'S/M',path:'generation-vii/ultra-sun-ultra-moon'},{key:'swsh',label:'Sw/Sh',path:'generation-viii/sword-shield'}];
const GAME_TO_SPRITE={'red-blue':'rb','yellow':'yellow','gold-silver':'gold','crystal':'crystal','ruby-sapphire':'rs','emerald':'emerald','firered-leafgreen':'frlg','diamond-pearl':'dp','platinum':'platinum','heartgold-soulsilver':'hgss','black-white':'bw-anim','black-2-white-2':'bw-anim','x-y':'xy','omega-ruby-alpha-sapphire':'oras','sun-moon':'sm','ultra-sun-ultra-moon':'sm','sword-shield':'swsh','scarlet-violet':'modern'};
function spriteKeyForCurrentGame(){return currentGame?GAME_TO_SPRITE[currentGame]||'modern':'modern'}

// ===== HELPERS =====
function getEff(a,d){return(EFF[a]&&EFF[a][d]!==undefined)?EFF[a][d]:1}
function getDualWeak(t1,t2){const r={};TYPES.forEach(a=>{let m=getEff(a,t1);if(t2)m*=getEff(a,t2);if(m!==1)r[a]=m});return r}
function cap(s){return s?s[0].toUpperCase()+s.slice(1):''}
function extractId(url){return parseInt(url.split('/').filter(Boolean).pop())}
function multLabel(m){if(m===0)return '×0';if(m<=0.25)return '×¼';if(m<1)return '×½';if(m>=4)return '×4';return '×2'}

// ===== STATE =====
let allPokemon=[],filteredPokemon=[],currentGen=null,currentGame=null,currentType=null;
let teams=JSON.parse(localStorage.getItem('pdx_teams')||'[{"name":"Team 1","pokemon":[]}]');
let currentTeamIdx=parseInt(localStorage.getItem('pdx_teamIdx')||'0');
if(currentTeamIdx>=teams.length)currentTeamIdx=0;
function activeTeam(){return teams[currentTeamIdx]?.pokemon||[]}
let currentDetailId=null,currentSpriteGame='modern',currentMoveGame=null;
const typeCache={},detailCache={},moveCache={},evoCache={},gamePokeCache={},typePokeCache={};
let movePicker={slotIndex:null,moveIndex:null,allMoves:[]};
let nickPicker={slotIndex:null};
const PAGE=40;let renderPage=1;

// ===== INIT =====
async function init(){
  renderTypeFilter();initTypeCalc();
  renderTeamSelector();
  document.getElementById('team-name-input').value=teams[currentTeamIdx]?.name||'';
  document.getElementById('team-name-input').oninput=()=>{
    if(!teams[currentTeamIdx])return;
    teams[currentTeamIdx].name=document.getElementById('team-name-input').value;
    saveTeamsToStorage();renderTeamSelector();
  };
  document.getElementById('poke-list').innerHTML='<div class="loader-wrap"><div class="loader"></div></div>';
  try{
    const r=await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025');
    const d=await r.json();
    allPokemon=d.results.map((p,i)=>({id:i+1,name:p.name}));
    filteredPokemon=[...allPokemon];
    renderList(filteredPokemon.slice(0,PAGE));setupScroll();
  }catch(e){document.getElementById('poke-list').innerHTML='<div class="empty-msg">⚠️ Could not load. Check connection.</div>'}
}

// ===== LIST =====
function renderList(pokemon){document.getElementById('poke-list').innerHTML='';renderPage=1;appendRows(pokemon)}

function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16);const g=parseInt(hex.slice(3,5),16);const b=parseInt(hex.slice(5,7),16);return`${r},${g},${b}`}
function typeGlass(type){const hex=TC[type];return hex?`rgba(${hexToRgb(hex)},0.14)`:'rgba(255,255,255,0.62)'}

function appendRows(pokemon){
  const list=document.getElementById('poke-list');
  if(!pokemon.length&&!list.children.length){list.innerHTML='<div class="empty-msg">No Pokémon found</div>';return}
  pokemon.forEach(p=>{
    const row=document.createElement('div');
    const inCurr=activeTeam().some(pk=>pk.id===p.id);
    const inAny=teams.some(t=>t.pokemon.some(pk=>pk.id===p.id));
    row.className='poke-row'+(inCurr?' in-team':'');
    row.id='row-'+p.id;row.onclick=()=>openDetail(p.id);
    row.style.background=typeCache[p.id]?typeGlass(typeCache[p.id][0]):'rgba(255,255,255,0.62)';
    row.innerHTML=`<img class="poke-row-img" loading="lazy" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" alt="${p.name}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png'"/>
      <div class="poke-row-body">

function setupScroll(){

  obs.observe(s);
}

async function lazyTypes(id){
  if(typeCache[id])return;
  try{
    const r=await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
    const d=await r.json();
    typeCache[id]=d.types.map(t=>t.type.name);detailCache[id]=d;

    if(el)el.innerHTML=typeCache[id].map(t=>`<span class="type-pill" style="background:${TC[t]}">${cap(t)}</span>`).join('');

// ===== FILTERING =====
async function filterPokemon(){
  const q=document.getElementById('search-input').value.toLowerCase().trim();
  let base=allPokemon;
  if(currentGen){const[lo,hi]=GR[currentGen];base=base.filter(p=>p.id>=lo&&p.id<=hi)}
  if(currentGame){
    const ids=await getGameIds(currentGame);
    base=base.filter(p=>ids.has(p.id));
  }
  if(q)base=base.filter(p=>p.name.includes(q)||String(p.id).includes(q));
  if(currentType){
    const ids=await getTypeIds(currentType);
    base=base.filter(p=>ids.has(p.id));
  }
  filteredPokemon=base;renderPage=1;
  const old=document.getElementById('scroll-sentinel');
  const ns=document.createElement('div');ns.id='scroll-sentinel';old.replaceWith(ns);
  renderList(filteredPokemon.slice(0,PAGE));setupScroll();
}

// FIX: Use type endpoint - returns ALL pokemon of that type in one call
async function getTypeIds(type){
  if(typePokeCache[type])return typePokeCache[type];
  const r=await fetch(`https://pokeapi.co/api/v2/type/${type}`);
  const d=await r.json();
  const ids=new Set(d.pokemon.map(p=>extractId(p.pokemon.url)));
  typePokeCache[type]=ids;
  return ids;
}

// FIX: Fetch ALL pokedexes per version group (fixes missing DLC pokemon like Hydrapple)
async function getGameIds(game){
  if(gamePokeCache[game])return gamePokeCache[game];
  const versions=GV[game]||[];const ids=new Set();
  for(const v of versions){
    try{
      const r=await fetch(`https://pokeapi.co/api/v2/version/${v}`);const d=await r.json();
      const gr=await fetch(d.version_group.url);const gd=await gr.json();
      for(const pdex of gd.pokedexes){
        try{
          const pr=await fetch(pdex.url);const pd=await pr.json();
          pd.pokemon_entries.forEach(e=>ids.add(extractId(e.pokemon_species.url)));
        }catch(e){}
      }
    }catch(e){}
  }
  gamePokeCache[game]=ids;return ids;
}

// ===== EVOLUTION TREE =====
async function loadEvo(url){
  try{
    let d=evoCache[url];if(!d){const r=await fetch(url);d=await r.json();evoCache[url]=d}
    document.getElementById('d-evo').innerHTML=renderEvoTree(d.chain);
  }catch(e){document.getElementById('d-evo').innerHTML='<div class="empty-msg">Could not load evolution data.</div>'}
}

function formatEvoConds(details){
  if(!details||!details.length)return[];
  const d=details[0];const c=[];
  if(d.trigger?.name==='trade')c.push('Trade');
  if(d.min_level)c.push('Lv.'+d.min_level);
  else if(d.trigger?.name==='level-up'&&!d.min_happiness&&!d.min_affection&&!d.known_move&&!d.location)c.push('Level up');
  if(d.item)c.push(cap(d.item.name.replace(/-/g,' ')));
  if(d.min_happiness)c.push('Friendship');
  if(d.min_affection)c.push('Affection '+d.min_affection);
  if(d.held_item)c.push('Hold: '+cap(d.held_item.name.replace(/-/g,' ')));
  if(d.known_move)c.push('Know: '+cap(d.known_move.name.replace(/-/g,' ')));
  if(d.known_move_type)c.push('Know '+cap(d.known_move_type.name)+' move');
  if(d.time_of_day)c.push(cap(d.time_of_day));
  if(d.gender!==null&&d.gender!==undefined)c.push(d.gender===1?'♀ only':'♂ only');
  if(d.needs_overworld_rain)c.push('Rain');
  if(d.relative_physical_stats!==null&&d.relative_physical_stats!==undefined)c.push(d.relative_physical_stats===1?'Atk>Def':d.relative_physical_stats===-1?'Def>Atk':'Atk=Def');
  if(d.location)c.push('At location');
  if(!c.length&&d.trigger?.name)c.push(cap(d.trigger.name.replace(/-/g,' ')));
  return c;
}

function renderEvoTree(chainNode){
  // Build levels: level[i] = array of {id, name, conditions (how to get HERE from parent)}
  const levels=[];
  function traverse(node,depth,conditions){
    if(!levels[depth])levels[depth]=[];
    levels[depth].push({id:extractId(node.species.url),name:node.species.name,conditions});
    node.evolves_to.forEach(child=>{
      traverse(child,depth+1,formatEvoConds(child.evolution_details));
    });
  }
  traverse(chainNode,0,[]);

  if(levels.length===1){
    const p=levels[0][0];
    return `<div class="evo-level"><div class="evo-item" onclick="openDetail(${p.id})"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png'" alt="${p.name}"/><span class="evo-item-name">${p.name}</span></div></div><div class="evo-no-evolve">Does not evolve</div>`;
  }

  let html='<div class="evo-tree">';
  levels.forEach((level,i)=>{
    // Arrow/condition row before each level (except the base)
    if(i>0){
      html+=`<div class="evo-arrow-row">`;
      level.forEach(p=>{
        html+=`<div class="evo-arrow-item">`;
        if(p.conditions.length)html+=`<span class="evo-cond-label">${p.conditions.join(' · ')}</span>`;
        html+=`<span>↓</span></div>`;
      });
      html+=`</div>`;
    }
    html+=`<div class="evo-level">`;
    level.forEach(p=>{
      html+=`<div class="evo-item" onclick="openDetail(${p.id})"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png'" alt="${p.name}"/><span class="evo-item-name">${p.name}</span></div>`;
    });
    html+=`</div>`;
  });
  html+='</div>';
  return html;
}

  saveTeamsToStorage();renderTeamSelector();closeRenameModal();
}
function switchTeam(idx){currentTeamIdx=idx;saveTeamsToStorage();document.getElementById('team-name-input').value=teams[idx]?.name||'';renderTeam();updateAllRows()}
function addTeam(){teams.push({name:'Team '+(teams.length+1),pokemon:[]});currentTeamIdx=teams.length-1;document.getElementById('team-name-input').value=teams[currentTeamIdx].name;saveTeams()}
function deleteTeam(idx){
  if(teams.length===1){alert('You need at least one team!');return}
  if(!confirm('Delete "'+( teams[idx].name||'Team '+(idx+1))+'"?'))return;
  teams.splice(idx,1);if(currentTeamIdx>=teams.length)currentTeamIdx=teams.length-1;
  document.getElementById('team-name-input').value=teams[currentTeamIdx]?.name||'';saveTeams();updateAllRows();
}

function renderTeam(){
  renderTeamSelector();
  const grid=document.getElementById('team-grid');grid.innerHTML='';
  const team=activeTeam();
  for(let i=0;i<6;i++){
    const slot=document.createElement('div');
    if(i<team.length){
      const p=team[i];slot.className='team-slot';
      slot.innerHTML=`<button class="ts-remove" onclick="event.stopPropagation();removeFromTeam(${i})">✕</button>
        <button class="ts-edit" onclick="event.stopPropagation();openNickModal(${i})">✏️</button>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png'" alt="${p.name}"/>
        <div class="ts-name">${p.nickname||p.name}</div>${p.nickname?`<div class="ts-nick">${p.name}</div>`:''}
        <div class="move-slots">${[0,1,2,3].map(mi=>`<button class="move-slot-btn${p.moves[mi]?' filled':''}" onclick="event.stopPropagation();openMovePicker(${i},${mi})">${p.moves[mi]?p.moves[mi].replace(/-/g,' '):'— Move '+(mi+1)}</button>`).join('')}</div>`;
      slot.onclick=()=>openDetail(p.id);
    }else{slot.className='team-slot empty';slot.innerHTML='<span class="empty-lbl"><span class="empty-plus">+</span>Add Pokémon</span>';slot.onclick=()=>openAddPokePicker();}
    grid.appendChild(slot);
  }
  updateCoverage();
}

function updateCoverage(){
  const team=activeTeam();
  const teamTypes=new Set(team.flatMap(p=>p.types));
  document.getElementById('offCoverage').innerHTML=teamTypes.size===0?'<span style="color:var(--subtext);font-size:13px">Add Pokémon to see coverage</span>':[...teamTypes].map(t=>`<span class="type-pill" style="background:${TC[t]};padding:5px 12px;font-size:12px">${cap(t)}</span>`).join('');
  const weakMap={};
  team.forEach(p=>{if(!p.types.length)return;const wmap=getDualWeak(p.types[0],p.types[1]);Object.entries(wmap).forEach(([t,m])=>{if(m>1)weakMap[t]=(weakMap[t]||0)+1})});
  const we=Object.entries(weakMap).sort((a,b)=>b[1]-a[1]);
  document.getElementById('teamWeakness').innerHTML=we.length===0?'<span style="color:var(--subtext);font-size:13px">No weaknesses identified</span>':we.map(([t,c])=>`<span class="type-pill" style="background:${TC[t]};padding:5px 12px;font-size:12px">${cap(t)} <span style="opacity:.7">×${c}</span></span>`).join('');
}

// ===== ADD POKEMON PICKER =====
function openAddPokePicker(){
  if(activeTeam().length>=6)return;
  document.getElementById('add-poke-title').textContent='Add to Team ('+(activeTeam().length)+'/6)';
  document.getElementById('add-poke-search').value='';
  renderAddPokeList('');
  document.getElementById('add-poke-modal').classList.add('open');
  setTimeout(()=>document.getElementById('add-poke-search').focus(),200);
}
function closeAddPokePicker(){document.getElementById('add-poke-modal').classList.remove('open')}
function renderAddPokeList(query){
  const q=query.toLowerCase().trim();
  const teamIds=new Set(activeTeam().map(p=>p.id));
  let list=allPokemon;
  if(q)list=allPokemon.filter(p=>p.name.includes(q)||String(p.id).startsWith(q));
  list=list.slice(0,60);
  document.getElementById('add-poke-list').innerHTML=list.map(p=>{
    const inTeam=teamIds.has(p.id);
    const types=typeCache[p.id]||[];
    const typePills=types.map(t=>`<span style="background:${TC[t]};color:white;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px">${cap(t)}</span>`).join('');
    return`<div class="add-poke-item${inTeam?' in-team':''}" onclick="${inTeam?'':'addPokemonFromPicker('+p.id+')'}">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" alt="${p.name}"/>
      <div>
        <div class="add-poke-name">${cap(p.name)}</div>
        <div class="add-poke-num">#${String(p.id).padStart(3,'0')}</div>
        ${typePills?`<div class="add-poke-types">${typePills}</div>`:''}
      </div>
      ${inTeam?'<span class="add-poke-badge">In team</span>':''}
    </div>`;
  }).join('')||'<div style="padding:20px;text-align:center;color:var(--subtext)">No Pokémon found</div>';
}
async function addPokemonFromPicker(id){
  const poke=allPokemon.find(p=>p.id===id);if(!poke)return;
  const team=activeTeam();if(team.length>=6)return;
  if(!typeCache[id]){
    try{const r=await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);const d=await r.json();typeCache[id]=d.types.map(t=>t.type.name);}catch(e){}
  }
  team.push({id,name:poke.name,nickname:'',types:typeCache[id]||[],moves:[null,null,null,null]});
  saveTeams();updateDetailTeamBtn();updateAllRows();closeAddPokePicker();
}

// ===== EXPORT / IMPORT =====
function exportTeams(){
  const blob=new Blob([JSON.stringify({teams,exportDate:new Date().toISOString()},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pokemon-teams.json';a.click();URL.revokeObjectURL(a.href);
}
function importTeams(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const imported=data.teams||data;
      if(!Array.isArray(imported))throw new Error('Invalid');
      if(confirm('Import '+imported.length+' team(s)? This replaces your current teams.')){
        teams=imported;currentTeamIdx=0;saveTeams();
        document.getElementById('team-name-input').value=teams[0]?.name||'';
        updateAllRows();
      }
    }catch(err){alert('Could not import. Make sure it\'s a valid teams file.')}
  };
  reader.readAsText(file);event.target.value='';
}

// ===== MOVE PICKER =====
async function openMovePicker(slotIdx,moveIdx){
  const p=activeTeam()[slotIdx];if(!p)return;
  movePicker={slotIndex:slotIdx,moveIndex:moveIdx,allMoves:[]};
  document.getElementById('move-modal-title').textContent='Move '+(moveIdx+1)+' — '+(p.nickname||p.name);
  document.getElementById('move-search').value='';
  document.getElementById('move-picker-game').value='';
  document.getElementById('move-modal-list').innerHTML='<div class="loader-wrap"><div class="loader"></div></div>';
  document.getElementById('move-modal').classList.add('open');
  if(!moveCache[p.id]){
    try{const r=await fetch(`https://pokeapi.co/api/v2/pokemon/${p.id}`);const d=await r.json();moveCache[p.id]=d.moves;if(!detailCache[p.id])detailCache[p.id]=d;if(!typeCache[p.id])typeCache[p.id]=d.types.map(t=>t.type.name)}catch(e){}
  }
  movePicker.allMoves=moveCache[p.id]||[];
  const gameSet=new Set();movePicker.allMoves.forEach(m=>m.version_group_details.forEach(vg=>gameSet.add(vg.version_group.name)));
  const sel=document.getElementById('move-picker-game');
  sel.innerHTML='<option value="">All games</option>'+[...gameSet].sort().map(g=>`<option value="${g}">${g}</option>`).join('');
  filterModalMoves();
}
function filterModalMoves(){
  const q=document.getElementById('move-search').value.toLowerCase();
  const gameFilter=document.getElementById('move-picker-game').value;
  let moves=movePicker.allMoves;
  if(gameFilter)moves=moves.filter(m=>m.version_group_details.some(vg=>vg.version_group.name===gameFilter));
  if(q)moves=moves.filter(m=>m.move.name.includes(q));
  const list=document.getElementById('move-modal-list');
  if(!moves.length){list.innerHTML='<div class="modal-move-none">No moves found</div>';return}
  list.innerHTML=`<div class="modal-move-item" onclick="selectMove(null)"><span class="modal-move-name" style="color:var(--subtext)">— Clear move slot</span></div>`+moves.slice(0,200).map(m=>`<div class="modal-move-item" onclick="selectMove('${m.move.name}')"><span class="modal-move-name">${m.move.name.replace(/-/g,' ')}</span></div>`).join('');
}
function selectMove(name){activeTeam()[movePicker.slotIndex].moves[movePicker.moveIndex]=name;saveTeams();document.getElementById('move-modal').classList.remove('open')}
document.getElementById('move-modal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open')});

// ===== NICKNAME =====
function openNickModal(i){nickPicker={slotIndex:i};const p=activeTeam()[i];document.getElementById('nick-modal-title').textContent='Nickname — '+p.name;document.getElementById('nick-input').value=p.nickname||'';document.getElementById('nick-modal').classList.add('open');setTimeout(()=>document.getElementById('nick-input').focus(),100)}
function closeNickModal(){document.getElementById('nick-modal').classList.remove('open')}
function saveNickname(){activeTeam()[nickPicker.slotIndex].nickname=document.getElementById('nick-input').value.trim();saveTeams();closeNickModal()}

// ===== TYPE CHART CALCULATOR =====
let calcType1=null,calcType2=null,activePickerSlot=1;
function initTypeCalc(){
  document.getElementById('tc-picker-grid').innerHTML=TYPES.map(t=>
    `<button class="tc-type-opt" style="background:${TC[t]}" onclick="selectCalcType('${t}')">${cap(t)}</button>`
  ).join('');
}
function openTypePicker(slot){
  activePickerSlot=slot;
  document.getElementById('tc-picker-title').textContent=slot===1?'Choose Type 1':'Choose Type 2';
  document.getElementById('tc-clear-btn').style.display=(slot===1?calcType1:calcType2)?'block':'none';
  document.getElementById('tc-picker').classList.add('open');
}
function closeTypePicker(e){if(e.target===document.getElementById('tc-picker'))document.getElementById('tc-picker').classList.remove('open')}
function selectCalcType(type){
  if(activePickerSlot===1)calcType1=type;else calcType2=type;
  document.getElementById('tc-picker').classList.remove('open');
  updateTypeBubbles();renderTypeCalcResults();
}
function clearCalcType(){
  if(activePickerSlot===1){calcType1=null;calcType2=null;}else calcType2=null;
  document.getElementById('tc-picker').classList.remove('open');
  updateTypeBubbles();renderTypeCalcResults();
}
function updateTypeBubbles(){
  const b1=document.getElementById('tc-bubble-1'),t1=document.getElementById('tc-bubble-1-text');
  if(calcType1){b1.style.background=TC[calcType1];b1.classList.add('filled');t1.textContent=cap(calcType1);}
  else{b1.style.background='';b1.classList.remove('filled');t1.textContent='Type 1';}
  const b2=document.getElementById('tc-bubble-2'),t2=document.getElementById('tc-bubble-2-text');
  if(calcType2){b2.style.background=TC[calcType2];b2.classList.add('filled');t2.textContent=cap(calcType2);}
  else{b2.style.background='';b2.classList.remove('filled');t2.textContent='+ Type 2';}
}
function renderTypeCalcResults(){
  const el=document.getElementById('tc-results');
  if(!calcType1){el.innerHTML='';return;}

  // === DEFENSIVE: what attacks do to the selected type(s) ===
  const defGroups={4:[],2:[],0.5:[],0.25:[],0:[]};
  if(calcType2){
    const wmap=getDualWeak(calcType1,calcType2);
    TYPES.forEach(atk=>{const m=wmap[atk]!==undefined?wmap[atk]:1;if(defGroups[m]!==undefined)defGroups[m].push(atk);});
  }else{
    TYPES.forEach(atk=>{const m=getEff(atk,calcType1);if(defGroups[m]!==undefined)defGroups[m].push(atk);});
  }
  const defSections=[
    {m:4,label:'×4 Weak to',color:'#e53935'},
    {m:2,label:'×2 Weak to',color:'#fb8c00'},
    {m:0.5,label:'×½ Resists',color:'#1e88e5'},
    {m:0.25,label:'×¼ Resists',color:'#1565c0'},
    {m:0,label:'×0 Immune to',color:'#757575'},
  ];
  const defHtml=defSections.filter(s=>defGroups[s.m].length).map(s=>
    `<div class="tc-result-section">
      <div class="tc-result-label" style="color:${s.color}">${s.label}</div>
      <div class="tc-result-types">${defGroups[s.m].map(t=>`<span class="type-pill" style="background:${TC[t]};padding:4px 10px">${cap(t)}</span>`).join('')}</div>
    </div>`
  ).join('')||'<div class="tc-result-normal">Neutral to all attacking types.</div>';

  // === OFFENSIVE: what the selected type(s) deal when attacking ===
  function atkSection(atkType){
    const og={2:[],0.5:[],0:[]};
    TYPES.forEach(def=>{const m=getEff(atkType,def);if(og[m]!==undefined)og[m].push(def);});
    const rows=[
      {m:2,label:'Super effective (×2)',color:'#e53935'},
      {m:0.5,label:'Not very effective (×½)',color:'#1e88e5'},
      {m:0,label:'No effect (×0)',color:'#757575'},
    ];
    return rows.filter(r=>og[r.m].length).map(r=>
      `<div class="tc-result-section">
        <div class="tc-result-label" style="color:${r.color}">${r.label}${calcType2?' — '+cap(atkType):''}</div>
        <div class="tc-result-types">${og[r.m].map(t=>`<span class="type-pill" style="background:${TC[t]};padding:4px 10px">${cap(t)}</span>`).join('')}</div>
      </div>`
    ).join('')||'<div class="tc-result-normal">Normal damage against all types.</div>';
  }
  const atkHtml=atkSection(calcType1)+(calcType2?atkSection(calcType2):'');

  el.innerHTML=
    `<div class="tc-section-header">🛡 Defending</div>${defHtml}`+
    `<div class="tc-section-header">⚔️ Attacking</div>${atkHtml}`;
}

// ===== TABS =====
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['dex','team','types'][i]===tab));
  document.getElementById('pokedex-view').style.display=tab==='dex'?'':'none';
  const tv=document.getElementById('team-view');if(tab==='team'){tv.classList.add('show');renderTeam()}else tv.classList.remove('show');
  const tyv=document.getElementById('types-view');if(tab==='types')tyv.classList.add('show');else tyv.classList.remove('show');
}

init();
</script>
